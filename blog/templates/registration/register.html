{% extends 'base.html' %}
{% block content %}
  <div class="card mx-auto" style="max-width: 400px;">
    <div class="card-body">
      <h1 class="card-title">Register</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Register</button>
      </form>
      <a href="{% url 'login' %}" class="btn btn-link mt-2">Login</a>
    </div>
  </div>
{% endblock %}
