{% extends 'base.html' %}
{% block content %}
  <div class="card">
    <div class="card-body">
      <h1 class="card-title">{% if form.instance.pk %}Edit{% else %}New{% endif %} Post</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
      </form>
      <a href="{% url 'post_list' %}" class="btn btn-outline-secondary mt-2">Back to list</a>
    </div>
  </div>
{% endblock %}
