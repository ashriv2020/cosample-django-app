{% extends 'base.html' %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="display-4">Blog Posts</h1>
    <!-- <div>
      {% if user.is_authenticated %}
        <a href="{% url 'post_create' %}" class="btn btn-primary me-2">New Post</a>
        <a href="{% url 'logout' %}" class="btn btn-outline-secondary">Logout</a>
      {% else %}
  <a href="{% url 'login' %}" class="btn btn-outline-primary">Login</a>
      {% endif %}
    </div> -->
  </div>
  <div class="list-group">
    {% for post in posts %}
      <div class="list-group-item">
        <h5 class="mb-1">{{ post.title }}</h5>
        <small class="text-muted">by {{ post.author.username }} on {{ post.created_at|date:'F d Y' }}</small>
        {% if post.category %}
          <span class="badge bg-secondary ms-2">{{ post.category.name }}</span>
        {% endif %}
        <div class="mt-2">
          <a href="{% url 'post_detail' post.slug %}" class="btn btn-sm btn-outline-primary">Read More</a>
        </div>
      </div>
    {% empty %}
      <div class="alert alert-info">No posts yet.</div>
    {% endfor %}
  </div>
{% endblock %}
