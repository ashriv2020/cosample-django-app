{% extends 'base.html' %}
{% block content %}
  <div class="card">
    <div class="card-body">
      <h1 class="card-title text-danger">Delete Post</h1>
      <p>Are you sure you want to delete "{{ post.title }}"?</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
      </form>
      <a href="{% url 'post_detail' post.pk %}" class="btn btn-outline-secondary mt-2">Cancel</a>
    </div>
  </div>
{% endblock %}
